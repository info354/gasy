
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Quotation - Final Update</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-bg: #ffffff;
            --accent-color: #f67e20; 
            --text-main: #282828;   
            --text-secondary: #6f6b65; 
            --border-color: #7e7a75;   
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .modal-card {
            background: var(--primary-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        /* HEADER INLINE - TIẾT KIỆM DIỆN TÍCH */
        .header-inline {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .icon-small {
            background-color: var(--accent-color);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .header-inline h2 {
            color: var(--text-main);
            font-size: 20px;
            font-weight: 700;
        }

        /* ALERT BOX */
        .alert-box {
            background-color: #fff8f3;
            border-left: 3px solid var(--accent-color);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .alert-title {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-color);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .alert-content {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.5;
        }

        /* LIST */
        .bullet-list {
            list-style: none;
            margin-bottom: 24px;
        }

        .bullet-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .bullet-point {
            width: 6px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }

        /* BUTTONS GROUP */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px 14px; /* Giảm padding vì đã có 2 dòng text */
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        /* NÚT CHÍNH - CONTINUE WITH QUOTATION */
        .btn-main {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-main:hover {
            filter: brightness(1.1);
            transform: scale(0.995);
        }

        /* NÚT PHỤ - DIRECT ORDER */
        .btn-outline {
            background: white;
            border: 1px solid #e0e0e0;
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: #fafafa;
            border-color: var(--border-color);
        }

        /* TEXT GHI CHÚ NHỎ DƯỚI NÚT */
        .btn-note {
            display: block;
            font-size: 10px;
            font-weight: 400;
            margin-top: 2px;
            opacity: 0.85;
            text-transform: none; /* Không in hoa để dễ phân biệt */
        }

        .btn-main .btn-note {
            color: #ffffff;
        }

        .btn-outline .btn-note {
            color: var(--text-secondary);
        }

        .btn-title {
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="modal-card">
        <div class="header-inline">
            <div class="icon-small">
                <i class="fa-solid fa-file-invoice"></i>
            </div>
            <h2>Confirm Quotation</h2>
        </div>

        <div class="alert-box">
            <div class="alert-title">
                <i class="fa-solid fa-circle-exclamation"></i> Delivery Delay Notice
            </div>
            <p class="alert-content">
                Manual review is required, which significantly increases processing time.
            </p>
        </div>

        <div class="bullet-list">
            <div class="bullet-item">
                <span class="bullet-point"></span> Requires confirmation from both parties.
            </div>
            <div class="bullet-item">
                <span class="bullet-point"></span> Credits will not be deducted immediately.
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-main">
                <span class="btn-title">Continue with Quotation</span>
                <span class="btn-note">Accept delay in delivery</span>
            </button>
            
            <button class="btn btn-outline">
                <span class="btn-title">Place Direct Order</span>
                <span class="btn-note">Optimize for fastest delivery</span>
            </button>
        </div>
    </div>

</body>
</html>
