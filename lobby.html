<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Lobby - Compact Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            white: '#ffffff',
                            orange: '#f67e20',
                            dark: '#282828',
                            ash: '#6f6b65',
                            brown: '#7e7a75',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>

    <style>
        body { background-color: #ffffff; color: #282828; -webkit-font-smoothing: antialiased; }
        .queue-card { 
            transition: all 0.3s ease; 
            border: 1px solid #7e7a75;
            background: #ffffff;
        }
        .queue-card:not(.disabled):hover { 
            border-color: #f67e20;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transform: translateY(-2px);
        }
        .progress-bar-fill { background-color: #f67e20; }
    </style>
</head>
<body class="min-h-screen font-sans">

    <header class="sticky top-0 z-50 w-full bg-white/95 backdrop-blur-sm border-b border-gray-100 px-6 py-2.5">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-brand-dark flex items-center justify-center text-white font-display text-sm font-bold">V</div>
                <div>
                    <h2 class="text-sm font-bold text-brand-dark leading-tight">viet.dt</h2>
                    <p class="text-[9px] font-semibold text-brand-ash uppercase tracking-tighter leading-none mt-0.5">Editor Active</p>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <div class="flex flex-col items-end gap-1">
                    <div class="flex items-center gap-3 text-[10px] font-bold uppercase tracking-tighter">
                        <span class="text-brand-ash">Quota: <span class="text-brand-dark">200m</span></span>
                        <span class="text-brand-orange">Actual: <span class="text-brand-dark">120m</span></span>
                    </div>
                    <div class="w-48 h-1 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full progress-bar-fill" style="width: 60%"></div>
                    </div>
                </div>
                <div class="h-8 w-[1px] bg-gray-200"></div>
                <button class="p-1.5 hover:bg-gray-50 rounded-md transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-brand-ash" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        
        <div class="mb-10">
            <h1 class="text-2xl font-display font-extrabold text-brand-dark tracking-tight">Lobby Grid</h1>
            <p class="text-sm text-brand-ash mt-1">Hệ thống phân phối công việc tự động.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            
            <div class="queue-card p-5 rounded-2xl flex flex-col gap-6">
                <div class="flex justify-between items-center">
                    <h3 class="text-2xl font-display font-bold text-brand-dark">HN1</h3>
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-brand-orange animate-pulse"></span>
                        <span class="text-[9px] font-bold text-brand-orange uppercase">Active</span>
                    </div>
                </div>
                
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-brand-ash font-medium">Active Jobs</span>
                        <span class="font-mono font-bold text-brand-dark">05</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-brand-ash font-medium">Total Photos</span>
                        <span class="font-mono font-bold text-brand-orange text-sm">24</span>
                    </div>
                </div>

                <button onclick="handleAssign('HN1', this)" class="w-full py-2.5 bg-brand-orange hover:bg-brand-dark text-white text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 group">
                    <span>Assign Next Job</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </div>

            <div class="queue-card p-5 rounded-2xl flex flex-col gap-6">
                <div class="flex justify-between items-center">
                    <h3 class="text-2xl font-display font-bold text-brand-dark">SG4</h3>
                    <div class="w-1.5 h-1.5 rounded-full bg-brand-orange"></div>
                </div>
                
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-brand-ash font-medium">Active Jobs</span>
                        <span class="font-mono font-bold text-brand-dark">12</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-brand-ash font-medium">Total Photos</span>
                        <span class="font-mono font-bold text-brand-orange text-sm">86</span>
                    </div>
                </div>

                <button onclick="handleAssign('SG4', this)" class="w-full py-2.5 bg-brand-orange hover:bg-brand-dark text-white text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 group">
                    <span>Assign Next Job</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </div>

            <div class="queue-card disabled p-5 rounded-2xl border-dashed border-brand-brown/40 bg-gray-50/50 opacity-40 flex flex-col gap-6">
                <div class="flex justify-between items-center">
                    <h3 class="text-2xl font-display font-bold text-brand-ash">DN2</h3>
                    <div class="w-1.5 h-1.5 rounded-full bg-brand-brown"></div>
                </div>
                
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-[10px] text-brand-ash uppercase font-bold tracking-widest border-b border-gray-200 pb-1">
                        <span>Status</span>
                        <span>Locked</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-brand-ash font-medium italic text-[10px]">Quota reached</span>
                    </div>
                </div>

                <button disabled class="w-full py-2.5 bg-brand-brown/20 text-brand-brown text-[10px] font-bold rounded-lg uppercase tracking-wider cursor-not-allowed">
                    Quota Exceeded
                </button>
            </div>

        </div>
    </main>

    <script>
        /**
         * Logic gán Job mô phỏng
         */
        function handleAssign(poolId, btn) {
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">Assigning...</span>`;
            
            setTimeout(() => {
                alert(`Hệ thống đã chọn 01 Job ưu tiên nhất từ Pool ${poolId} cho bạn.`);
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 800);
        }
    </script>
</body>
</html>
