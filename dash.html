<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Responsive Production Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff;
            --accent: #f67e20;
            --dark: #282828;
            --ash: #6f6b65;
            --border: #7e7a7533;
            --bg-soft: #fafafa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg-soft); 
            color: var(--dark); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; /* Prevent body scroll, handle scroll in main-wrapper */
        }

        /* --- NAVIGATION --- */
        nav { 
            width: 80px; 
            background: var(--dark); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 30px 0; 
            border-right: 1px solid var(--border); 
            z-index: 100;
        }
        .nav-item { 
            width: 40px; height: 40px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            display: flex; align-items: center; justify-content: center; 
            color: var(--white); 
            cursor: pointer; transition: 0.3s; opacity: 0.5; 
        }
        .nav-item.active { 
            background: var(--accent); opacity: 1; 
            box-shadow: 0 4px 15px rgba(246, 126, 32, 0.3); 
        }

        /* --- MAIN CONTENT --- */
        .main-wrapper { 
            flex: 1; 
            padding: 40px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }
        
        /* Header Section */
        header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; }
        .title-area h1 { font-size: 28px; font-weight: 700; color: var(--dark); line-height: 1.2; }
        .title-area p { color: var(--ash); font-size: 13px; margin-top: 8px; }
        .filter-select { 
            padding: 10px 15px; border-radius: 10px; border: 1px solid var(--border); 
            font-size: 13px; color: var(--dark); font-weight: 600; cursor: pointer; background: var(--white);
            outline: none;
        }

        /* KPI Grid */
        .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 40px; }
        .kpi-card { background: var(--white); padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); position: relative; overflow: hidden; }
        .kpi-card::after { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); }
        .kpi-label { font-size: 12px; font-weight: 600; color: var(--ash); text-transform: uppercase; letter-spacing: 1px; }
        .kpi-value { font-size: 32px; font-weight: 700; margin: 10px 0; display: flex; align-items: baseline; }
        .kpi-sub { font-size: 14px; color: var(--ash); font-weight: 400; margin-left: 8px; }

        /* Distribution Section */
        .section-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 25px; margin-bottom: 40px; }
        .panel { background: var(--white); padding: 25px; border-radius: 20px; border: 1px solid var(--border); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .panel-title { font-size: 16px; font-weight: 700; }

        /* Distribution Bars */
        .dist-bar-item { margin-bottom: 20px; }
        .dist-info { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
        .progress-track { width: 100%; height: 8px; background: #f0f0f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 10px; }

        /* Modern Table */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .job-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; min-width: 600px; }
        .job-table th { text-align: left; padding: 10px 15px; color: var(--ash); font-size: 12px; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
        .job-table tr td { padding: 16px 15px; background: var(--white); border-top: 1px solid #f5f5f5; border-bottom: 1px solid #f5f5f5; font-size: 14px; white-space: nowrap; }
        .job-table tr td:first-child { border-radius: 12px 0 0 12px; border-left: 1px solid #f5f5f5; }
        .job-table tr td:last-child { border-radius: 0 12px 12px 0; border-right: 1px solid #f5f5f5; }

        /* Status Badge */
        .status { padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; display: inline-block; }
        .status-processing { background: #fff5eb; color: #f67e20; }
        .status-complete { background: #e8f7ed; color: #219653; }
        .status-new { background: #f2f2f2; color: #666; }
        .status-pending { background: #fce4ec; color: #d81b60; }

        /* =========================================
           MOBILE RESPONSIVE QUERIES
           ========================================= */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            
            /* Change Sidebar to Bottom Nav */
            nav {
                width: 100%;
                height: 65px;
                flex-direction: row;
                justify-content: space-around;
                padding: 0;
                border-right: none;
                border-top: 1px solid #333;
                order: 2; /* Put it at the bottom */
            }
            .nav-item { margin-bottom: 0; width: auto; padding: 0 20px; }
            .nav-item.active { box-shadow: none; border-bottom: 3px solid var(--accent); border-radius: 0; background: transparent; color: var(--accent); }

            /* Main Content Adjustments */
            .main-wrapper { 
                padding: 20px 15px; 
                order: 1; 
                padding-bottom: 30px; /* Extra space at bottom */
            }
            
            header { flex-direction: column; align-items: flex-start; gap: 15px; margin-bottom: 25px; }
            .title-area h1 { font-size: 24px; }
            .filters { width: 100%; }
            .filter-select { width: 100%; }

            /* Stack Grids */
            .kpi-row { grid-template-columns: 1fr; gap: 15px; margin-bottom: 25px; }
            .kpi-card { padding: 20px; }
            
            .section-grid { grid-template-columns: 1fr; gap: 15px; margin-bottom: 25px; }
            .panel { padding: 20px 15px; }

            /* Typography Adjustments */
            .kpi-value { font-size: 28px; }
        }

    </style>
</head>
<body>

    <nav>
        <div class="nav-item active">⊞</div>
        <div class="nav-item">📊</div>
        <div class="nav-item">⚙️</div>
    </nav>

    <div class="main-wrapper">
        <header>
            <div class="title-area">
                <h1>Global Production</h1>
                <p>System: <span style="color: #219653; font-weight: 600;">Live</span> • Updated just now</p>
            </div>
            <div class="filters">
                <select class="filter-select" id="officeFilter">
                    <option value="all">All Offices</option>
                    <option value="HN">Ha Noi (HN)</option>
                    <option value="HY">Hung Yen (HY)</option>
                    <option value="LS">Lang Son (LS)</option>
                </select>
            </div>
        </header>

        <div class="kpi-row">
            <div class="kpi-card">
                <div class="kpi-label">Volume Processed</div>
                <div class="kpi-value" id="totalImg">3,450 <span class="kpi-sub">Images</span></div>
                <p style="font-size: 12px; color: var(--ash);">↑ 12% vs last shift</p>
            </div>
            <div class="kpi-card" style="border-color: var(--dark);">
                <div class="kpi-label">Time Equivalent</div>
                <div class="kpi-value" id="totalMins" style="color: var(--accent);">13,800 <span class="kpi-sub" style="color: var(--accent);">Mins</span></div>
                <p style="font-size: 12px; color: var(--ash);">Based on 4m/img</p>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Active Agents</div>
                <div class="kpi-value">42 <span class="kpi-sub">Online</span></div>
                <div style="display: flex; gap: 5px; margin-top: 5px;">
                    <div style="width: 8px; height: 8px; background: #219653; border-radius: 50%;"></div>
                    <div style="width: 8px; height: 8px; background: #219653; border-radius: 50%;"></div>
                    <div style="width: 8px; height: 8px; background: #ddd; border-radius: 50%;"></div>
                </div>
            </div>
        </div>

        <div class="section-grid">
            <div class="panel">
                <div class="panel-header" style="flex-wrap: wrap; gap: 10px;">
                    <div class="panel-title">Volume Distribution</div>
                    <span style="font-size: 12px; color: var(--ash); background: #f0f0f0; padding: 4px 8px; border-radius: 4px;">Night Shift</span>
                </div>
                <div id="distContainer">
                    </div>
            </div>
            
            <div class="panel" style="background: var(--dark); color: var(--white); border: none;">
                <div class="panel-header">
                    <div class="panel-title" style="color: var(--white);">Top Performance</div>
                </div>
                <div id="leaderboard">
                    </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">Job Queue</div>
                <button style="border: none; background: none; color: var(--accent); font-weight: 700; font-size: 13px; cursor: pointer;">Filters</button>
            </div>
            
            <div class="table-responsive">
                <table class="job-table">
                    <thead>
                        <tr>
                            <th>Job ID</th>
                            <th>Office</th>
                            <th>Step</th>
                            <th>Qty</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="jobTable">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const data = {
            offices: [
                { name: 'HN - Ha Noi', val: 1450, color: '#f67e20' },
                { name: 'HY - Hung Yen', val: 1100, color: '#282828' },
                { name: 'LS - Lang Son', val: 900, color: '#7e7a75' }
            ],
            jobs: [
                { id: '1077529', office: 'HN', step: 'Edit', qty: 150, status: 'Processing' },
                { id: '597746', office: 'LS', step: 'QA', qty: 45, status: 'Complete' },
                { id: '595559', office: 'HY', step: 'Edit', qty: 210, status: 'New' },
                { id: '597708', office: 'HN', step: 'QA', qty: 80, status: 'Processing' },
                { id: '597720', office: 'LS', step: 'Edit', qty: 35, status: 'Pending' }
            ],
            leaders: [
                { name: 'hung.tm', mins: 1801 },
                { name: 'huong.tt', mins: 1776 },
                { name: 'mai.tn', mins: 1375 }
            ]
        };

        function init() {
            // Render Distribution
            const distContainer = document.getElementById('distContainer');
            const maxVal = Math.max(...data.offices.map(o => o.val));
            
            data.offices.forEach(o => {
                const perc = (o.val / maxVal) * 100;
                distContainer.innerHTML += `
                    <div class="dist-bar-item">
                        <div class="dist-info">
                            <span>${o.name}</span>
                            <span>${o.val}</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${perc}%; background: ${o.color}"></div>
                        </div>
                    </div>
                `;
            });

            // Render Jobs
            const table = document.getElementById('jobTable');
            data.jobs.forEach(j => {
                table.innerHTML += `
                    <tr>
                        <td><strong>#${j.id}</strong></td>
                        <td>${j.office}</td>
                        <td>${j.step}</td>
                        <td>${j.qty}</td>
                        <td style="color: var(--ash)">${j.qty * 4}m</td>
                        <td><span class="status status-${j.status.toLowerCase()}">${j.status}</span></td>
                    </tr>
                `;
            });

            // Render Leaders
            const lb = document.getElementById('leaderboard');
            data.leaders.forEach(l => {
                lb.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1)">
                        <span style="font-size: 14px; opacity: 0.9;">${l.name}</span>
                        <span style="font-weight: 700; color: var(--accent);">${l.mins.toLocaleString()}m</span>
                    </div>
                `;
            });
        }

        init();
    </script>
</body>
</html>
