<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý - Gasy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      display: flex;
      height: 100vh;
      background-color: #f4f6f8;
      overflow: hidden;
    }
    /* Thanh Menu bên trái */
    .sidebar {
      width: 280px;
      background: #ffffff;
      border-right: 1px solid #e1e4e8;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 15px;
      color: #0969da;
      padding-bottom: 10px;
      border-bottom: 2px solid #0969da;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .menu-item {
      display: block;
      padding: 10px 12px;
      background: #f8f9fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      text-decoration: none;
      color: #24292f;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .menu-item:hover {
      background: #ddf4ff;
      border-color: #54aeff;
      color: #0969da;
      transform: translateX(3px);
    }
    /* Khung chiếu hiển thị trang con */
    .content-area {
      flex-grow: 1;
      height: 100vh;
      background: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Menu chọn trang con -->
  <div class="sidebar">
    <h2>📊 Gasy Dashboard</h2>
    
    <a href="./lobby.html" target="view-frame" class="menu-item">🏠 Sảnh chính (Lobby)</a>
    <a href="./dash.html" target="view-frame" class="menu-item">📈 Tổng quan (Dash)</a>
    <a href="./main_menu.html" target="view-frame" class="menu-item">📑 Menu chính (Main Menu)</a>
    <a href="./bxh.html" target="view-frame" class="menu-item">🏆 Bảng xếp hạng (BXH)</a>
    <a href="./group_ranking.html" target="view-frame" class="menu-item">🥇 Xếp hạng nhóm</a>
    <a href="./crt.html" target="view-frame" class="menu-item">📋 Danh mục CRT</a>
    <a href="./project_list_cso.html" target="view-frame" class="menu-item">📁 Danh sách Dự án CSO</a>
    <a href="./srv_list.html" target="view-frame" class="menu-item">🛠️ Danh sách Dịch vụ</a>
    <a href="./stats_personal.html" target="view-frame" class="menu-item">👤 Thống kê cá nhân</a>
    <a href="./quotation_alert.html" target="view-frame" class="menu-item">🔔 Thấy báo giá (Quotation Alert)</a>
  </div>

  <!-- Màn hình chiếu nội dung file con bên phải (Mặc định nạp lobby.html) -->
  <div class="content-area">
    <iframe name="view-frame" src="./lobby.html"></iframe>
  </div>

</body>
</html>
