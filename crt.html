<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correction Report - UI/UX Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --white: #ffffff;
            --accent: #f67e20;
            --dark-grey: #282828;
            --ashy-grey: #6f6b65;
            --brown-grey: #7e7a75;
            --light-bg: #f9f9f9;
            --success: #27ae60;
            --info: #2980b9;
        }

        /* --- GLOBAL STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--white);
            color: var(--dark-grey);
            line-height: 1.6;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* --- HEADER & FILTERS --- */
        header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark-grey);
        }

        .filter-section {
            background: var(--light-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            border: 1px solid #eee;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid var(--brown-grey);
            background: var(--white);
            color: var(--ashy-grey);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        button.active, button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        button.btn-primary {
            background-color: var(--accent);
            color: var(--white);
            border: none;
            font-weight: 600;
        }

        select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--brown-grey);
            color: var(--dark-grey);
            outline: none;
        }

        /* --- TABLE STYLES --- */
        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: var(--dark-grey);
            color: var(--white);
        }

        th {
            padding: 15px;
            font-weight: 500;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: var(--ashy-grey);
        }

        tr:hover {
            background-color: #fafafa;
        }

        .staff-name {
            font-weight: 600;
            color: var(--dark-grey);
        }

        /* --- STATUS BADGES --- */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-perfect { background: #e8f5e9; color: var(--success); }
        .badge-good { background: #e3f2fd; color: var(--info); }
        .badge-pass { background: #f5f5f5; color: var(--ashy-grey); }
        .badge-fail { background: #fff3e0; color: var(--accent); text-transform: uppercase;}

        .rate-value {
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Correction Report</h1>
        <button class="btn-primary">Export Report (CSV)</button>
    </header>

    <div class="filter-section">
        <div class="btn-group">
            <button>Today</button>
            <button class="active">This Week</button>
            <button>This Month</button>
            <button>Last Month</button>
        </div>
        <div style="height: 24px; width: 1px; background: #ddd; margin: 0 10px;"></div>
        <select>
            <option>All Offices</option>
            <option>Hanoi Office</option>
            <option>Danang Office</option>
        </select>
        <select>
            <option>Individual: All Staff</option>
            <option>viet.dt</option>
            <option>an.nguyen</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Staff Member</th>
                    <th>Total Images</th>
                    <th>Corrections</th>
                    <th>Rate (%)</th>
                    <th>Performance Status</th>
                </tr>
            </thead>
            <tbody id="report-body">
                </tbody>
        </table>
    </div>
</div>

<script>
    // Dữ liệu mẫu (Mock data)
    const reportData = [
        { name: "viet.dt", total: 100, correction: 0 },
        { name: "an.nguyen", total: 150, correction: 1 },
        { name: "hoang.pham", total: 120, correction: 1 },
        { name: "linh.tran", total: 90, correction: 3 },
        { name: "minh.vu", total: 200, correction: 2 },
        { name: "thao.le", total: 85, correction: 0 }
    ];

    const tableBody = document.getElementById('report-body');

    function renderTable(data) {
        tableBody.innerHTML = '';

        data.forEach(item => {
            // Tính toán tỷ lệ phần trăm
            const rate = (item.correction / item.total) * 100;
            let statusHTML = '';

            // Logic đánh giá hiệu suất
            if (rate === 0) {
                statusHTML = '<span class="badge badge-perfect">Hoàn hảo</span>';
            } else if (rate < 1) {
                statusHTML = '<span class="badge badge-good">Tốt</span>';
            } else if (rate === 1) {
                statusHTML = '<span class="badge badge-pass">Đạt</span>';
            } else {
                statusHTML = '<span class="badge badge-fail">Không đạt</span>';
            }

            // Tạo hàng dữ liệu
            const row = `
                <tr>
                    <td class="staff-name">${item.name}</td>
                    <td>${item.total}</td>
                    <td>${item.correction}</td>
                    <td class="rate-value">${rate.toFixed(1)}%</td>
                    <td>${statusHTML}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    // Khởi tạo bảng khi load trang
    renderTable(reportData);

    // Xử lý sự kiện click đơn giản cho các nút filter
    const filterBtns = document.querySelectorAll('.btn-group button');
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            // Trong thực tế, đây là nơi bạn gọi API để lấy dữ liệu mới
            console.log("Filtering for: " + btn.innerText);
        });
    });
</script>

</body>
</html>
