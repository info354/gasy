<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Optimized Staff Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff;
            --vibrant-orange: #f67e20;
            --dark-grey: #282828;
            --ashy-grey: #6f6b65;
            --brown-grey: #7e7a75;
            --light-bg: #f9fafb;
            --border-color: #e5e7eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--white); color: var(--dark-grey); padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }

        header { margin-bottom: 20px; }
        header h1 { font-size: 20px; }

        /* FILTER SECTION RESPONSIVE */
        .filter-section {
            background: var(--light-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .quick-btns { 
            display: flex; 
            gap: 8px; 
            overflow-x: auto; /* Cuộn ngang trên mobile */
            padding-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Ẩn thanh cuộn nhưng vẫn cuộn được */
        .quick-btns::-webkit-scrollbar { display: none; }

        .btn-filter {
            flex: 0 0 auto; /* Không cho co lại */
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
        }
        .btn-filter.active { background: var(--vibrant-orange); color: white; border-color: var(--vibrant-orange); }

        .date-inputs { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-top: 15px; 
        }
        input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
        }

        /* KPI GRID RESPONSIVE */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 cột trên mobile */
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .kpi-card {
            background: white;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid var(--border-color);
        }
        
        .kpi-card.full-width { grid-column: span 2; } /* Card Incentive chiếm trọn chiều ngang */
        .kpi-card.highlight { border-left-color: var(--vibrant-orange); }

        .kpi-label { color: var(--ashy-grey); font-size: 10px; font-weight: 600; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .kpi-value { font-size: 18px; font-weight: 700; word-break: break-all; }

        /* TABLE RESPONSIVE */
        .table-container { 
            background: white; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            overflow-x: auto; /* Cuộn ngang cho bảng */
        }
        
        table { width: 100%; border-collapse: collapse; min-width: 600px; /* Đảm bảo bảng không quá hẹp */ }
        th { background: var(--dark-grey); color: white; padding: 12px; font-size: 12px; text-align: left; }
        td { padding: 12px; font-size: 13px; border-bottom: 1px solid #f3f4f6; }

        .row-day { background: #fffcf9; font-weight: 700; cursor: pointer; }
        .row-detail { display: none; }
        .row-detail.show { display: table-row; }

        .text-orange { color: var(--vibrant-orange); }

        /* DESKTOP ADJUSTMENTS */
        @media (min-width: 768px) {
            header h1 { font-size: 26px; }
            .kpi-grid { grid-template-columns: repeat(3, 1fr); }
            .kpi-card.full-width { grid-column: span 1; }
            .kpi-value { font-size: 24px; }
            .date-inputs { display: flex; align-items: center; width: auto; }
            input[type="date"] { width: 160px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Staff Report</h1>
    </header>

    <section class="filter-section">
        <div class="quick-btns" id="quick-filters">
            <button class="btn-filter" data-range="today">Today</button>
            <button class="btn-filter active" data-range="this-week">This Week</button>
            <button class="btn-filter" data-range="last-week">Last Week</button>
            <button class="btn-filter" data-range="this-month">This Month</button>
            <button class="btn-filter" data-range="last-month">Last Month</button>
        </div>
        
        <div class="date-inputs">
            <input type="date" id="start-date">
            <input type="date" id="end-date">
        </div>
    </section>

    <div class="kpi-grid">
        <div class="kpi-card">
            <span class="kpi-label">Money</span>
            <div class="kpi-value" id="kpi-money">0</div>
        </div>
        <div class="kpi-card">
            <span class="kpi-label">Mins</span>
            <div class="kpi-value" id="kpi-mins">0</div>
        </div>
        <div class="kpi-card highlight full-width">
            <span class="kpi-label">Incentive</span>
            <div class="kpi-value text-orange" id="kpi-incentive">0</div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date/ID</th>
                    <th>Code</th>
                    <th>Qty</th>
                    <th>Money</th>
                    <th>Incentive</th>
                </tr>
            </thead>
            <tbody id="data-body"></tbody>
        </table>
    </div>
</div>

<script>
    const CONFIG = { PRICE: 4000, MIN_PER_QTY: 8, THRESHOLD: 431, RATE: 0.25 };
    let rawData = [];

    function generateMockData() {
        const data = [];
        const now = new Date();
        for (let i = 0; i < 30; i++) {
            const date = new Date();
            date.setDate(now.getDate() - i);
            const dateStr = date.toISOString().split('T')[0];
            const servicesCount = Math.floor(Math.random() * 3) + 2;
            for (let j = 1; j <= servicesCount; j++) {
                data.push({
                    date: dateStr,
                    serviceId: `ID-${Math.floor(Math.random() * 900)}`,
                    code: `S${j}`,
                    qty: Math.floor(Math.random() * 40) + 10
                });
            }
        }
        return data;
    }

    function renderTable(grouped) {
        const tbody = document.getElementById('data-body');
        tbody.innerHTML = '';
        let gMoney = 0, gMins = 0, gInc = 0;

        Object.keys(grouped).sort().reverse().forEach((date, idx) => {
            let dQty = 0, dMoney = 0, dMins = 0;
            grouped[date].forEach(i => {
                dQty += i.qty;
                dMoney += i.qty * CONFIG.PRICE;
                dMins += i.qty * CONFIG.MIN_PER_QTY;
            });

            const dInc = dMins > CONFIG.THRESHOLD ? (dMins - CONFIG.THRESHOLD) * CONFIG.RATE : 0;
            gMoney += dMoney; gMins += dMins; gInc += dInc;

            const hRow = document.createElement('tr');
            hRow.className = 'row-day';
            hRow.innerHTML = `
                <td>📅 ${date}</td>
                <td>-</td>
                <td>${dQty}</td>
                <td>${dMoney.toLocaleString()}</td>
                <td class="text-orange">${dInc > 0 ? dInc.toLocaleString() : '-'}</td>
            `;
            hRow.onclick = () => document.querySelectorAll(`.child-${idx}`).forEach(r => r.classList.toggle('show'));
            tbody.appendChild(hRow);

            grouped[date].forEach(i => {
                const r = document.createElement('tr');
                r.className = `row-detail child-${idx}`;
                r.innerHTML = `<td>${i.serviceId}</td><td>${i.code}</td><td>${i.qty}</td><td>${(i.qty*CONFIG.PRICE).toLocaleString()}</td><td></td>`;
                tbody.appendChild(r);
            });
        });

        document.getElementById('kpi-money').innerText = gMoney.toLocaleString();
        document.getElementById('kpi-mins').innerText = gMins.toLocaleString();
        document.getElementById('kpi-incentive').innerText = gInc.toLocaleString();
    }

    // Logic lọc giữ nguyên như bản trước
    function updateReport() {
        const start = new Date(document.getElementById('start-date').value);
        const end = new Date(document.getElementById('end-date').value);
        end.setHours(23, 59, 59, 999);
        const filtered = rawData.filter(item => { const d = new Date(item.date); return d >= start && d <= end; });
        const grouped = filtered.reduce((acc, curr) => { acc[curr.date] = acc[curr.date] || []; acc[curr.date].push(curr); return acc; }, {});
        renderTable(grouped);
    }

    function setRange(range) {
        const now = new Date(); let s = new Date(), e = new Date();
        if(range === 'this-week') s.setDate(now.getDate() - now.getDay());
        else if(range === 'last-week') { s.setDate(now.getDate() - now.getDay() - 7); e.setDate(now.getDate() - now.getDay() - 1); }
        else if(range === 'this-month') s = new Date(now.getFullYear(), now.getMonth(), 1);
        else if(range === 'last-month') { s = new Date(now.getFullYear(), now.getMonth()-1, 1); e = new Date(now.getFullYear(), now.getMonth(), 0); }
        document.getElementById('start-date').value = s.toISOString().split('T')[0];
        document.getElementById('end-date').value = e.toISOString().split('T')[0];
        updateReport();
    }

    document.getElementById('quick-filters').addEventListener('click', (e) => {
        if(e.target.classList.contains('btn-filter')) {
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            setRange(e.target.dataset.range);
        }
    });

    window.onload = () => { rawData = generateMockData(); setRange('this-week'); };
</script>
</body>
</html>
